[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-mcp"
version = "0.1.0"
description = "Just-In-Time skill & MCP tool loader for AI agents. Reduces context bloat by 97%."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "JIT Contributors"},
]
keywords = ["mcp", "ai", "agents", "skills", "context", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
jit = "jit.cli:main"

[project.urls]
Homepage = "https://github.com/jit-mcp/jit"
Repository = "https://github.com/jit-mcp/jit"
Documentation = "https://github.com/jit-mcp/jit#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["jit*"]

[tool.setuptools.package-data]
jit = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"