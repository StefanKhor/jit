name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24.x"]
    env:
      JIT_HOME: ${{ github.workspace }}/.jit-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip the 130 MB model bake so this job stays hermetic and fast; it still
      # exercises every layer that breaks (npm ci, tsc, vite, the runtime layout,
      # the dropped privileges). Production builds omit the arg and bake the model.
      - name: Build the image
        run: docker build --build-arg JIT_SKIP_MODEL_WARMUP=1 -t jit:ci .

      - name: Smoke-test the image
        # The bind guard refuses 0.0.0.0 without an API key — deliberate, and
        # exactly what a production container should do. The smoke test gets a
        # throwaway key; /api/health is pre-auth, so the curl needs no header.
        # --retry-connrefused alone is not enough: while the server is still
        # importing its modules, Docker's proxy accepts the connection and then
        # resets it, which curl reports as exit 56 and will not retry without
        # --retry-all-errors. Twenty tries at 2s covers the multi-second boot.
        run: |
          docker run -d --name jit-ci -p 3000:3000 -e JIT_API_KEY=ci-smoke-key jit:ci
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-connrefused --retry-all-errors \
            http://127.0.0.1:3000/api/health
          docker exec jit-ci ls /app/dist /app/static

      - name: Container logs
        if: always()
        run: docker logs jit-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f jit-ci || true
