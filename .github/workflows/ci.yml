name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24.x"]
    env:
      # The vector path is covered locally, where the model is cached. CI stays
      # hermetic: no 130 MB download and no flaky network dependency.
      JIT_SKIP_EMBEDDING_TESTS: "1"
      JIT_HOME: ${{ runner.temp }}/jit-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (app, dashboard, tests, scripts)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Retrieval eval (offline, keyword-only)
        run: npm run eval -- --min-recall1 0.9 --min-mrr 0.9

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip the 130 MB model bake so this job stays hermetic and fast; it still
      # exercises every layer that breaks (npm ci, tsc, vite, the runtime layout,
      # the dropped privileges). Production builds omit the arg and bake the model.
      - name: Build the image
        run: docker build --build-arg JIT_SKIP_MODEL_WARMUP=1 -t jit:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name jit-ci -p 3000:3000 jit:ci
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-connrefused http://127.0.0.1:3000/api/health
          docker exec jit-ci ls /app/dist /app/static

      - name: Container logs
        if: always()
        run: docker logs jit-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f jit-ci || true
